<div class="container">
    <div class="row">
        <div class="col-sm-12">
            <form class="form-inline">


                <!-- Botones de Filtro -->
                <div class="btn-group mt-3" role="group" aria-label="Filtro">
                    <input type="radio" class="btn-check" name="filter" id="filterAll" [(ngModel)]="filter" value="all"
                        autocomplete="off" checked>
                    <label class="btn btn-outline-primary" for="filterAll">Todos</label>

                    <input type="radio" class="btn-check" name="filter" id="filterNoBookings" [(ngModel)]="filter"
                        value="NOBOOKINGS" autocomplete="off">
                    <label class="btn btn-outline-primary" for="filterNoBookings">Sin reservas</label>

                    <input type="radio" class="btn-check" name="filter" id="filterActives" [(ngModel)]="filter"
                        value="WITHACTIVEBOOKINGS" autocomplete="off">
                    <label class="btn btn-outline-primary" for="filterActives">Con reservas activas</label>

                    <input type="radio" class="btn-check" name="filter" id="filterInactives" [(ngModel)]="filter"
                        value="WITHINACTIVEBOOKINGS" autocomplete="off">
                    <label class="btn btn-outline-primary" for="filterInactives">Sin reservas activas</label>
                </div>
            </form>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <ng-container *ngFor="let user of Users">
                        <tr *ngIf="filter === 'all' ||
                                (filter === 'WITHINACTIVEBOOKINGS' && user.status === 'WITHINACTIVEBOOKINGS') ||
                                (filter === 'NOBOOKINGS' && user.status === 'NOBOOKINGS') ||
                                (filter === 'WITHACTIVEBOOKINGS' && user.status === 'WITHACTIVEBOOKINGS')">
                            <td>
                                <i>{{user.name}}</i>
                            </td>
                            <td>
                                <i>{{user.email}}</i>
                            </td>
                            <td>
                                <i>{{user.status}}</i>

                            </td>
                            <td>
                                <button type="button" class="btn btn-primary ms-3" data-bs-toggle="modal"
                                data-bs-target="#editUser" (click)="abrirModalEditar(user)">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-gear" viewBox="0 0 16 16">
                                    <path d="M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0M8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m.256 7a4.5 4.5 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10q.39 0 .74.025c.226-.341.496-.65.804-.918Q8.844 9.002 8 9c-5 0-6 3-6 4s1 1 1 1zm3.63-4.54c.18-.613 1.048-.613 1.229 0l.043.148a.64.64 0 0 0 .921.382l.136-.074c.561-.306 1.175.308.87.869l-.075.136a.64.64 0 0 0 .382.92l.149.045c.612.18.612 1.048 0 1.229l-.15.043a.64.64 0 0 0-.38.921l.074.136c.305.561-.309 1.175-.87.87l-.136-.075a.64.64 0 0 0-.92.382l-.045.149c-.18.612-1.048.612-1.229 0l-.043-.15a.64.64 0 0 0-.921-.38l-.136.074c-.561.305-1.175-.309-.87-.87l.075-.136a.64.64 0 0 0-.382-.92l-.148-.045c-.613-.18-.613-1.048 0-1.229l.148-.043a.64.64 0 0 0 .382-.921l-.074-.136c-.306-.561.308-1.175.869-.87l.136.075a.64.64 0 0 0 .92-.382zM14 12.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0"/>
                                  </svg>                            </button>  
                            <a class="btn btn-danger ms-3" (click)="borrar(user.id)">-</a>
                        </td> 
                        </tr>
                    </ng-container>

                </tbody>
            </table>
        </div>
    </div>
</div>

<!--editar usuarios  -->
<div class="modal" id="editUser" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Editar Usuario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editUserForm">
                    <div class="mb-3">
                        <label for="userName" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="userName" [(ngModel)]="user.name" name="userName"
                            placeholder="Introduce el nuevo nombre">
                    </div>
                    <div class="mb-3">
                        <label for="userEmail" class="form-label">Gmail</label>
                        <input type="email" class="form-control" id="userEmail" [(ngModel)]="user.email"
                            name="userEmail" placeholder="Introduce el nuevo correo electrónico">
                    </div>
                    <div class="mb-3">
                        <label for="userpassword" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="userpassword" [(ngModel)]="user.password"
                            name="password" placeholder="Introduce la nueva Contraseña ">
                    </div>
                    <div class="mb-3">
                        <label for="confirmpassword" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="confirmpassword" [(ngModel)]="confirmPassword"
                            name="confirmPassword" placeholder="Repite la nueva Contraseña ">
                    </div>
                    <div *ngIf="mostrarMensaje" class="text-danger">
                        {{ mensaje }}
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-primary"  data-bs-dismiss="modal" [disabled]="!samePassword()" (click)="guardarCambios()">Guardar Cambios</button>
            </div>
        </div>
    </div>
</div>
