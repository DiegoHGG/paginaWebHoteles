volumes:  
  kong_data: {}
  db_data_bookings: {}
  db_data_users: {}
  db_data_hotels: {}

networks: 
  kong-net: # Red interna para la comunicación entre servicios

services:

  #######################################
  # Postgres: The database used by Kong
  #######################################
  kong-database:
    image: postgres:9.6
    container_name: kong-postgres
    restart: on-failure
    networks:
      - kong-net
    volumes:
      - kong_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD:-kong}
      POSTGRES_DB: kong
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 30s
      timeout: 30s
      retries: 3

  #######################################
  # Kong database migration
  #######################################
  kong-migration:
    image: ${KONG_DOCKER_TAG:-kong:latest}
    command: kong migrations bootstrap
    networks:
      - kong-net
    restart: on-failure
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong}
    depends_on:
      kong-database:
        condition: service_healthy

  #######################################
  # Kong: The API Gateway
  #######################################
  kong:
    image: ${KONG_DOCKER_TAG:-kong:latest}
    restart: on-failure
    networks:
      - kong-net
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong}
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PROXY_LISTEN_SSL: 0.0.0.0:8443
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    depends_on:
      kong-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8443:8443"
      - "8444:8444"

  #######################################
  # Konga database prepare
  #######################################
  konga-prepare:
    image: pantsel/konga:latest
    command: "-c prepare -a postgres -u postgresql://kong:${KONG_PG_PASSWORD:-kong}@kong-database:5432/konga"
    networks:
      - kong-net
    restart: on-failure
    depends_on:
      kong-database:
        condition: service_healthy

  #######################################
  # Konga: Kong GUI
  #######################################
  konga:
    image: pantsel/konga:latest
    restart: always
    networks:
      - kong-net  
    environment:
      DB_ADAPTER: postgres
      DB_URI: postgresql://kong:${KONG_PG_PASSWORD:-kong}@kong-database:5432/konga
      NODE_ENV: production
    depends_on:
      kong-database:
        condition: service_healthy
    ports:
      - "1337:1337"
      
  #######################################
  # APIS
  #######################################

  # Servicio: RoomBooking Bookings API
  roomBookingBookingsApi:
    image: room-booking-bookings-image
    build:
      context: ./RoomBookingBooking/RoomBookingBooking
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - 8082:8082 
    networks:
      - kong-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://roomBookingBookingsDB:3306/roomBookingBookingsDB?createDatabaseIfNotExist=true

    depends_on:
      - roomBookingBookingsDB

  # Servicio: RoomBooking Users API
  roomBookingUsersApi:
    image: room-booking-users-image
    build:
      context: ./RoomBookingUsers/RoomBookingUsers
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - 8084:8084 
    networks:
      - kong-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://roomBookingUsersDB:3306/roomBookingUsersDB?createDatabaseIfNotExist=true

    depends_on:
      - roomBookingUsersDB

# Servicio: RoomBooking Hotels API
  roomBookingHotelsApi:
    image: room-booking-hotels-image
    build:
      context: ./RoomBookingHotels/RoomBookingHotels
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - 8083:8083 
    networks:
      - kong-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://roomBookingHotelsDB:3306/roomBookingHotelsDB?createDatabaseIfNotExist=true

    depends_on:
      - roomBookingHotelsDB

  # Servicio: Auth API
  authApi:
    image: auth-image
    build:
      context: ./roomBookingAuth 
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - 8081:8081 
    networks:
      - kong-net

  # Servicio: Angular Frontend
  angular:
    image: angular-frontend-image
    build:
      context: ./angularRoomBooking/reservaHoteles
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - 4200:80 
    depends_on:
      - authApi
      - roomBookingHotelsApi
      - roomBookingBookingsApi
      - roomBookingUsersApi
    stdin_open: true
    tty: true
    networks:
      - kong-net

  #######################################
  # Bases de datos
  #######################################
  # Servicio: Base de Datos MySQL para Bookings
  roomBookingBookingsDB:
    image: mysql
    container_name: roomBookingBookingsDB
    restart: unless-stopped
    networks:
      - kong-net
    volumes:
      - db_data_bookings:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: roomBookingBookingsDB
    ports:
      - "3307:3306"

  roomBookingUsersDB:
    image: mysql
    container_name: roomBookingUsersDB
    restart: unless-stopped
    networks:
      - kong-net
    volumes:
      - db_data_users:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: roomBookingUsersDB
    ports:
      - "3308:3306"

  roomBookingHotelsDB:
    image: mysql
    container_name: roomBookingHotelsDB
    restart: unless-stopped
    networks:
      - kong-net
    volumes:
      - db_data_hotels:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: roomBookingHotelsDB
    ports:
      - "3309:3306"